description = "Code-quality + security audit of the codebase, a path, or a branch diff (judge + security-reviewer)."

prompt = '''
User request: {{args}}

# /audit

Run a comprehensive code-quality + security audit on the codebase or a specific scope.

## Usage

```
/audit          # entire codebase
/audit <path>       # specific dir or file
/audit <branch>      # specific branch's diff against main
```

## Steps

### Phase 1: Plan
1. Identify files in scope
2. Check repo size: total files, recently changed files
3. List the audit categories you'll cover

### Phase 2: Code review
Spawn `judge` against the scope. Capture findings.

### Phase 3: Security review
Spawn `security-reviewer` against the scope. Capture findings.

### Phase 4: Test health
- Run `your project's test command` — all green?
- Coverage at ≥80%?
- Identify untested critical paths

### Phase 5: Tooling health
- `your project's format command` clean?
- `your project's lint command` clean?
- Dependency security: any known CVEs?

## Output
```markdown
# Audit Report: <scope> — <date>

## Summary
- Critical: <n>
- High: <n>
- Medium: <n>
- Low: <n>

## Findings (grouped by severity)
...

## Recommended actions
1. ...
```

---

## On hosts without subagents

On Claude Code, `pmo`, `backend-dev`/`frontend-dev`, `judge`, and
`security-reviewer` are subagents the main conversation spawns. On hosts without
subagents (Codex, OpenCode, Antigravity), **play each role yourself, in
sequence, switching hats explicitly** — say which hat you're wearing. Produce
the same artifacts under `docs/specs/<slug>/`, stop at the same human gates
(contract approval; failing tests under TDD), and run the review passes with the
`verify` and `security-audit` skills. The artifacts, the gates, and the
Definition of Done are identical; only the executor changes.
'''

name: ci

on:
  push:
  pull_request:

jobs:
  plugin-mirror:
    name: Plugin mirror in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated trees mirror core/
        run: bash scripts/build.sh --check

  package-validation:
    name: Claude packaging install-ready
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests + agents + commands + skills frontmatter
        run: |
          pip install pyyaml >/dev/null 2>&1 || true
          python3 scripts/validate-packaging.py

  render-smoke:
    name: Examples render clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render every example and check for problems
        run: |
          set -e
          fail=0
          for ans in examples/*/answers.env; do
            ex=$(basename "$(dirname "$ans")")
            d=$(mktemp -d)
            bash setup.sh --target "$d" --answers "$ans"
            # no unrendered {{var}} / {{#var}} / leftover requires-directives
            if grep -rEl '[{][{][#/^]?[a-zA-Z_][a-zA-Z0-9_]*[}][}]|<!--[[:space:]]*requires' "$d"; then
              echo "::error::leftover placeholders in $ex"; fail=1
            fi
            # settings.json must parse
            python3 -c "import json,sys; json.load(open('$d/.claude/settings.json'))" \
              || { echo "::error::invalid settings.json in $ex"; fail=1; }
            # hooks must be valid bash
            for h in "$d"/.claude/hooks/*.sh; do bash -n "$h" || { echo "::error::hook syntax in $ex"; fail=1; }; done
          done
          # non-claude hosts: render one example per host, zero leftover placeholders
          PH='[{][{][#/^]?[a-zA-Z_][a-zA-Z0-9_]*[}][}]|<!--[[:space:]]*requires'
          d=$(mktemp -d); bash setup.sh --target "$d" --answers examples/node-nextjs/answers.env --host cursor
          grep -rEl "$PH" "$d" && { echo "::error::leftover placeholders in cursor render"; fail=1; }
          for h in "$d"/.cursor/hooks/*.sh; do bash -n "$h" || { echo "::error::cursor hook syntax"; fail=1; }; done
          # rendered cursor JSON must parse (mcp.json is a template pre-render; the render must be valid)
          python3 -c "import json; json.load(open('$d/.cursor/mcp.json')); json.load(open('$d/.cursor/hooks.json'))" \
            || { echo "::error::invalid rendered cursor JSON"; fail=1; }
          d=$(mktemp -d); bash setup.sh --target "$d" --answers examples/node-nextjs/answers.env --host grok
          grep -rEl "$PH" "$d" && { echo "::error::leftover placeholders in grok render"; fail=1; }
          d=$(mktemp -d); bash setup.sh --target "$d" --answers examples/node-nextjs/answers.env --host codex
          grep -rEl "$PH" "$d" && { echo "::error::leftover placeholders in codex render"; fail=1; }
          # contract smoke scenarios (scripts/smoke/mf*.sh)
          bash scripts/smoke.sh || fail=1
          exit $fail
